version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # Closing a socket or read-only image we're done with; nothing useful
        # to do on failure.
        - syscall.Close
        - (github.com/shaneshort/xl710-unlocker.NVM).Close
    staticcheck:
      checks:
        - all
        # golangci-lint defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Errors are printed straight to the user, and the multi-line ones
        # carry recovery instructions on purpose.
        - -ST1005

formatters:
  enable:
    - gofmt
