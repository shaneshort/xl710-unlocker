name: release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make VERSION="${GITHUB_REF_NAME}"
      - run: sha256sum xl710-unlock-linux-amd64 > SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" xl710-unlock-linux-amd64 SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
